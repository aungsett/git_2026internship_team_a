<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Applicant Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .table-container {
            border: 1px solid #e5e7eb;
            border-radius: 0.5rem;
            overflow: hidden;
        }
        th {
            background-color: #f3f4f6;
            color: #374151;
            font-weight: 600;
            text-align: left;
            padding: 0.75rem 1rem;
            border-bottom: 1px solid #e5e7eb;
        }
        td {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid #f3f4f6;
            vertical-align: middle;
        }
        tr:last-child td {
            border-bottom: none;
        }
        tr:hover td {
            background-color: #f9fafb;
        }
        .filter-select {
            border: 1px solid #d1d5db;
            border-radius: 0.375rem;
            padding: 0.5rem 2rem 0.5rem 0.75rem;
            appearance: none;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 0.5rem center;
            background-size: 1.5em 1.5em;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen font-sans text-gray-900">

    <div class="max-w-[1400px] mx-auto p-6">
        <!-- Add somewhere in header/tool bar -->
        <a href="/admin-logout" class="px-3 py-1 border rounded text-sm hover:bg-gray-100">Logout</a>
        
        <!-- Top Toolbar & Stats -->
        <div class="flex flex-col lg:flex-row justify-between items-start lg:items-center mb-8 gap-6">
            
            <!-- Filters & Search -->
            <div class="flex flex-wrap items-center gap-3">
                <div class="relative">
                    <input type="text" id="searchInput" placeholder="Search applicants..." 
                           class="pl-10 pr-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none w-64">
                    <div class="absolute left-3 top-2.5 text-gray-400">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                        </svg>
                    </div>
                </div>

                <select class="filter-select bg-white text-sm" id="degreeFilter">
                    <option value="">Filter by Degree</option>
                    <option value="highschool">High School</option>
                    <option value="bachelors">Bachelor's Degree</option>
                    <option value="masters">Master's Degree</option>
                    <option value="phd">PhD</option>
                </select>

                <select class="filter-select bg-white text-sm" id="statusFilter">
                    <option value="">Filter by Status</option>
                    <option value="Pending">Pending</option>
                    <option value="Shortlisted">Shortlisted</option>
                    <option value="Rejected">Rejected</option>
                    <option value="Accepted">Accepted</option>
                </select>

                <div class="flex flex-wrap items-center gap-2">
                    <select class="filter-select bg-white text-sm" id="experienceFilter" title="Built from current applicant data">
                        <option value="">Any experience</option>
                    </select>
                    <div id="customExpRangeWrap" class="hidden flex flex-wrap items-center gap-2 text-sm">
                        <label for="expCustomMin" class="text-gray-600 whitespace-nowrap">Min (yrs)</label>
                        <input type="number" id="expCustomMin" min="0" step="0.5" class="w-20 border border-gray-300 rounded px-2 py-1.5 text-sm" placeholder="0">
                        <span class="text-gray-400">–</span>
                        <label for="expCustomMax" class="text-gray-600 whitespace-nowrap">Max (yrs)</label>
                        <input type="number" id="expCustomMax" min="0" step="0.5" class="w-20 border border-gray-300 rounded px-2 py-1.5 text-sm" placeholder="∞">
                    </div>
                </div>

                <button type="button" id="exportCsvBtn" class="px-4 py-2 bg-white border border-gray-300 rounded-md hover:bg-gray-50 text-sm font-medium shadow-sm flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                    </svg>
                    Export to CSV
                </button>
            </div>

            <!-- Stats Summary -->
            <div class="text-right text-sm border-l-4 border-blue-500 pl-4 py-1 space-y-0.5">
                <div class="font-semibold text-gray-500">
                    Total matching: <span class="text-gray-900" id="totalCount">0</span>
                </div>
                <div class="text-orange-600">
                    Pending: <span class="font-bold" id="pendingCount">0</span>
                </div>
                <div class="text-green-600">
                    Shortlisted: <span class="font-bold" id="shortlistedCount">0</span>
                </div>
                <div class="text-red-600">
                    Rejected: <span class="font-bold" id="rejectedCount">0</span>
                </div>
                <div class="text-blue-600">
                    Accepted: <span class="font-bold" id="acceptedCount">0</span>
                </div>
            </div>
        </div>

        <!-- Table Container -->
        <div class="bg-white shadow-sm table-container">
            <div class="overflow-x-auto">
                <table class="w-full text-sm">
                    <thead>
                        <tr>
                            <th class="w-10"><input type="checkbox" id="selectAll" class="rounded" title="Select all"></th>
                            <th>Applicant ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Degree</th>
                            <th>Exp</th>
                            <th>Preferred Japanese Course</th>
                            <th>Status</th>
                            <th>Submitted At</th>
                            <th class="text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="applicantTableBody">
                        <!-- Rows will be injected by JS -->
                    </tbody>
                </table>
            </div>

            <!-- Pagination Footer -->
            <div class="px-6 py-4 flex items-center justify-center border-t border-gray-200">
                <nav class="flex items-center gap-4">
                    <button type="button" id="prevPageBtn" class="p-2 rounded-full transition-colors text-gray-700 hover:bg-gray-100 disabled:opacity-40 disabled:pointer-events-none" aria-label="Previous page">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                        </svg>
                    </button>
                    <span id="pageInfo" class="text-sm font-medium min-w-[8rem] text-center">Page 1 of 1</span>
                    <button type="button" id="nextPageBtn" class="p-2 rounded-full transition-colors text-gray-700 hover:bg-gray-100 disabled:opacity-40 disabled:pointer-events-none" aria-label="Next page">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                        </svg>
                    </button>
                </nav>
            </div>
        </div>
    </div>

    <!-- View Modal -->
    <div id="viewModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
        <div class="bg-white rounded-lg p-8 max-w-2xl w-full mx-4 shadow-2xl relative">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
            <h2 class="text-2xl font-bold mb-6 border-bottom pb-4" id="modalName">Applicant Details</h2>
            <div class="grid grid-cols-2 gap-y-4 text-sm" id="modalBody">
                <!-- Content injected by JS -->
            </div>
            <div class="mt-8 flex justify-end gap-3">
                <button onclick="closeModal()" class="px-6 py-2 border border-gray-300 rounded hover:bg-gray-50">Close</button>
                <button class="px-6 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Download CV</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = "http://127.0.0.1:5000";
        const token = localStorage.getItem("admin_id_token");
        if (!token) {
            // No token -> go back to login
            window.location.href = "/admin-login";
        }

        const PAGE_SIZE = 10;
        let currentPage = 1;
        let applicants = [];
        const selectedIds = new Set();
        let lastRenderedData = [];

        function formatDate(iso) {
            if (!iso) return "";
            const d = new Date(iso);
            if (Number.isNaN(d.getTime())) return String(iso);
            return d.toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });
        }

        function formatDegree(degree) {
            switch ((degree || "").toLowerCase()) {
                case "highschool":
                    return "High School";
                case "bachelors":
                    return "Bachelor's";
                case "masters":
                    return "Master's";
                case "phd":
                    return "PhD";
                default:
                    return degree || "";
            }
        }

        function csvEscapeCell(value) {
            const s = String(value ?? "");
            if (/[",\r\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
            return s;
        }

        function exportSelectedToCsv() {
            const ids = Array.from(selectedIds);
            if (ids.length === 0) {
                alert("Select one or more applicants (checkboxes), then click Export to CSV.");
                return;
            }
            const rows = ids
                .map(id => applicants.find(a => a.id === id))
                .filter(Boolean)
                .sort((a, b) => a.id.localeCompare(b.id, undefined, { numeric: true }));
            const header = [
                "Applicant ID",
                "Full Name",
                "Email",
                "Degree",
                "Experience (years)",
                "Preferred Japanese Course",
                "Status",
                "Submitted At"
            ];
            const lines = [
                header.join(","),
                ...rows.map(r =>
                    [
                        r.id,
                        r.name,
                        r.email,
                        formatDegree(r.degree),
                        r.exp,
                        r.course,
                        r.status,
                        r.date
                    ].map(csvEscapeCell).join(",")
                )
            ];
            const csv = "\uFEFF" + lines.join("\r\n");
            const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            const stamp = new Date().toISOString().slice(0, 10);
            a.href = url;
            a.download = `applicants_export_${stamp}.csv`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function renderTable(data, statsSource) {
            const stats = statsSource !== undefined ? statsSource : data;
            lastRenderedData = data;
            const tbody = document.getElementById('applicantTableBody');
            tbody.innerHTML = data.map(app => `
                <tr class="transition-colors">
                    <td><input type="checkbox" class="rounded row-checkbox" data-applicant-id="${app.id}" ${selectedIds.has(app.id) ? 'checked' : ''}></td>
                    <td class="font-medium text-gray-500">${app.id}</td>
                    <td class="font-medium">${app.name}</td>
                    <td class="text-gray-500">${app.email}</td>
                    <td>${formatDegree(app.degree)}</td>
                    <td>${app.exp}</td>
                    <td>${app.course}</td>
                    <td>
                        <span class="px-2 py-1 rounded-full text-xs font-semibold ${getStatusClass(app.status)}">
                            ${app.status}
                        </span>
                    </td>
                    <td class="text-gray-500">${app.date}</td>
                    <td>
                        <div class="flex items-center justify-center">
                            <button onclick="viewApplicant('${app.id}')" class="flex flex-col items-center group">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-gray-400 group-hover:text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                                </svg>
                                <span class="text-[10px] text-gray-400 group-hover:text-blue-600">View</span>
                            </button>
                        </div>
                    </td>
                </tr>
            `).join('');
            
            // Stats reflect full filtered set, not just current page
            document.getElementById('totalCount').textContent = stats.length;
            document.getElementById('pendingCount').textContent = stats.filter(a => a.status === 'Pending').length;
            document.getElementById('shortlistedCount').textContent = stats.filter(a => a.status === 'Shortlisted').length;
            document.getElementById('rejectedCount').textContent = stats.filter(a => a.status === 'Rejected').length;
            document.getElementById('acceptedCount').textContent = stats.filter(a => a.status === 'Accepted').length;
            syncSelectAllCheckbox();
        }

        function updatePaginationUI(totalFiltered, totalPages) {
            const info = document.getElementById('pageInfo');
            const prevBtn = document.getElementById('prevPageBtn');
            const nextBtn = document.getElementById('nextPageBtn');
            if (info) info.textContent = `Page ${currentPage} of ${totalPages}`;
            if (prevBtn) prevBtn.disabled = currentPage <= 1;
            if (nextBtn) nextBtn.disabled = currentPage >= totalPages;
        }

        function syncSelectAllCheckbox() {
            const selectAll = document.getElementById('selectAll');
            if (!selectAll) return;
            const visibleIds = lastRenderedData.map(a => a.id);
            const allSelected = visibleIds.length > 0 && visibleIds.every(id => selectedIds.has(id));
            selectAll.checked = allSelected;
            selectAll.indeterminate = visibleIds.some(id => selectedIds.has(id)) && !allSelected;
        }

        function getStatusClass(status) {
            switch(status) {
                case 'Pending': return 'bg-orange-100 text-orange-700';
                case 'Shortlisted': return 'bg-green-100 text-green-700';
                case 'Rejected': return 'bg-red-100 text-red-700';
                case 'Accepted': return 'bg-blue-100 text-blue-700';
                default: return 'bg-gray-100 text-gray-700';
            }
        }

        function viewApplicant(id) {
            window.location.href = `/admin/applicants/${id}/detail`;
        }

        function closeModal() {
            document.getElementById('viewModal').classList.add('hidden');
        }

        function parseExperienceYears(exp) {
            if (exp === null || exp === undefined) return NaN;
            const s = String(exp).trim();
            if (s === "") return NaN;
            const direct = Number(s);
            if (Number.isFinite(direct)) return direct;
            const m = s.match(/^(\d+(?:\.\d+)?)/);
            if (m) return Number(m[1]);
            return NaN;
        }

        function toggleCustomExpVisibility() {
            const wrap = document.getElementById("customExpRangeWrap");
            const show = document.getElementById("experienceFilter").value === "custom";
            wrap.classList.toggle("hidden", !show);
        }

        function rebuildExperienceFilterOptions() {
            const sel = document.getElementById("experienceFilter");
            const prev = sel.value;
            const unique = [...new Set(
                applicants.map(a => parseExperienceYears(a.exp)).filter(n => Number.isFinite(n))
            )].sort((a, b) => a - b);

            sel.innerHTML = "";
            const optAny = document.createElement("option");
            optAny.value = "";
            optAny.textContent = "Any experience";
            sel.appendChild(optAny);

            unique.forEach(v => {
                const o = document.createElement("option");
                o.value = "gte:" + v;
                o.textContent = "≥ " + v + " yr" + (v === 1 ? "" : "s");
                sel.appendChild(o);
            });

            const oCust = document.createElement("option");
            oCust.value = "custom";
            oCust.textContent = "Custom range…";
            sel.appendChild(oCust);

            const allowed = new Set(["", "custom", ...unique.map(v => "gte:" + v)]);
            sel.value = allowed.has(prev) ? prev : "";
            toggleCustomExpVisibility();
        }

        function matchesExperienceFilter(app) {
            const mode = document.getElementById("experienceFilter").value;
            const y = parseExperienceYears(app.exp);
            if (mode === "") return true;
            if (mode === "custom") {
                const minEl = document.getElementById("expCustomMin");
                const maxEl = document.getElementById("expCustomMax");
                let lo = minEl.value === "" ? -Infinity : Number(minEl.value);
                let hi = maxEl.value === "" ? Infinity : Number(maxEl.value);
                if (!Number.isFinite(lo)) lo = -Infinity;
                if (!Number.isFinite(hi)) hi = Infinity;
                if (lo > hi) {
                    const t = lo;
                    lo = hi;
                    hi = t;
                }
                if (!Number.isFinite(y)) return false;
                return y >= lo && y <= hi;
            }
            if (mode.startsWith("gte:")) {
                const t = Number(mode.slice(4));
                if (!Number.isFinite(y) || !Number.isFinite(t)) return false;
                return y >= t;
            }
            return true;
        }

        // Search and Filter Logic + pagination (10 rows per page)
        function filterData(resetPage) {
            if (resetPage) currentPage = 1;

            const search = document.getElementById('searchInput').value.toLowerCase();
            const degree = document.getElementById('degreeFilter').value;
            const status = document.getElementById('statusFilter').value;

            const filtered = applicants.filter(app => {
                const matchesSearch = app.name.toLowerCase().includes(search) || app.email.toLowerCase().includes(search) || app.id.includes(search);
                const matchesDegree = !degree || app.degree === degree;
                const matchesStatus = !status || app.status === status;
                const matchesExp = matchesExperienceFilter(app);
                
                return matchesSearch && matchesDegree && matchesStatus && matchesExp;
            });

            const totalFiltered = filtered.length;
            const totalPages = Math.max(1, Math.ceil(totalFiltered / PAGE_SIZE));
            if (currentPage > totalPages) currentPage = totalPages;
            if (currentPage < 1) currentPage = 1;

            const start = (currentPage - 1) * PAGE_SIZE;
            const pageSlice = filtered.slice(start, start + PAGE_SIZE);

            renderTable(pageSlice, filtered);
            updatePaginationUI(totalFiltered, totalPages);
        }

        // Row checkbox: toggle selection (event delegation)
        document.getElementById('applicantTableBody').addEventListener('change', function(e) {
            const cb = e.target;
            if (!cb.classList.contains('row-checkbox')) return;
            const id = cb.getAttribute('data-applicant-id');
            if (!id) return;
            if (cb.checked) selectedIds.add(id);
            else selectedIds.delete(id);
            syncSelectAllCheckbox();
        });

        document.getElementById('selectAll').addEventListener('change', function() {
            if (this.checked) {
                lastRenderedData.forEach(a => selectedIds.add(a.id));
            } else {
                lastRenderedData.forEach(a => selectedIds.delete(a.id));
            }
            lastRenderedData.forEach(a => {
                const rowCb = document.querySelector(`.row-checkbox[data-applicant-id="${a.id}"]`);
                if (rowCb) rowCb.checked = this.checked;
            });
        });

        document.getElementById('exportCsvBtn').addEventListener('click', exportSelectedToCsv);

        document.getElementById('prevPageBtn').addEventListener('click', function() {
            if (currentPage > 1) {
                currentPage--;
                filterData(false);
            }
        });
        document.getElementById('nextPageBtn').addEventListener('click', function() {
            currentPage++;
            filterData(false);
        });

        // Reset to page 1 when search/filters change
        document.getElementById('searchInput').addEventListener('input', function() { filterData(true); });
        document.getElementById('degreeFilter').addEventListener('change', function() { filterData(true); });
        document.getElementById('statusFilter').addEventListener('change', function() { filterData(true); });
        document.getElementById('experienceFilter').addEventListener('change', function() {
            toggleCustomExpVisibility();
            filterData(true);
        });
        document.getElementById('expCustomMin').addEventListener('input', function() {
            if (document.getElementById('experienceFilter').value === 'custom') filterData(true);
        });
        document.getElementById('expCustomMax').addEventListener('input', function() {
            if (document.getElementById('experienceFilter').value === 'custom') filterData(true);
        });

        async function loadApplicants() {
            const fetchLimit = 100;
            let page = 1;
            const allRows = [];
            for (;;) {
                const resp = await fetch(
                    `${API_BASE}/admin/applicants?page=${page}&limit=${fetchLimit}`,
                    { headers: { "Authorization": `Bearer ${token}` } }
                );
                if (!resp.ok) {
                    throw new Error(`Failed to load applicants (${resp.status})`);
                }
                const payload = await resp.json();
                const batch = payload.data || [];
                let total = Number(payload.total);
                if (Number.isNaN(total)) total = batch.length;
                allRows.push(...batch);
                if (batch.length < fetchLimit || allRows.length >= total) break;
                page += 1;
                if (page > 500) break;
            }
            applicants = allRows.map(a => ({
                id: String(a.applicant_id),
                name: a.full_name || "",
                email: a.email || "",
                degree: a.degree || "",
                exp: String(a.experience_years ?? ""),
                course: a.preferred_course || "",
                status: a.status || "Pending",
                date: formatDate(a.submitted_at),
            }));
            currentPage = 1;
            rebuildExperienceFilterOptions();
            filterData(false);
        }

        // Initial Render from backend
        loadApplicants().catch(err => {
            console.error(err);
            alert("Failed to load applicants. Check backend logs and admin auth.");
        });
    </script>
</body>
</html>

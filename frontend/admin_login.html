<!DOCTYPE html>
<html>
<head>
    <title>Admin Login</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .login-bg {
            background: radial-gradient(circle at top left, #ffe6d5, #f8fafc);
        }
        .backdrop {
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.75);
        }
    </style>
</head>
<body class="login-bg min-h-screen flex items-center justify-center px-4 relative">

    <a href="/"
       class="absolute left-6 top-8 flex items-center text-gray-600 hover:text-black transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-1" fill="none" viewBox="0 0 24 24"
             stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
        </svg>
        <span class="font-medium">Back to Home</span>
    </a>

    <div class="max-w-md w-full backdrop rounded-2xl shadow-2xl border border-white/60 p-8">
        <h2 class="text-2xl font-semibold mb-2 text-center tracking-tight">Admin Login</h2>
        <p class="text-xs text-gray-500 mb-6 text-center">Secure access for authorized HR team members</p>

        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-gray-700 mb-1">Email</label>
                <input type="email" id="email"
                       class="w-full border border-gray-300 px-3 py-2 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-sm bg-white/80"
                       required>
            </div>

            <div>
                <label class="block text-xs font-medium text-gray-700 mb-1">Password</label>
                <div class="relative">
                    <input type="password" id="password"
                           class="w-full border border-gray-300 px-3 py-2 pr-11 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-sm bg-white/80"
                           required>
                    <button type="button" id="togglePassword"
                            class="absolute inset-y-0 right-0 flex items-center px-3 text-gray-500 hover:text-gray-700"
                            aria-label="Show password" aria-pressed="false">
                        <svg id="eyeOpenIcon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                        <svg id="eyeClosedIcon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a9.956 9.956 0 012.223-3.592m3.1-2.383A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.542 7a9.97 9.97 0 01-4.132 5.411M15 12a3 3 0 00-3-3m0 0a2.99 2.99 0 00-2.12.879M12 9l0 0m0 0L3 21" />
                        </svg>
                    </button>
                </div>
            </div>

            <button type="submit"
                    class="w-full bg-blue-600 text-white py-2.5 rounded-lg hover:bg-blue-700 transition-colors text-sm font-medium shadow-sm">
                Login
            </button>
        </form>

        <p id="errorMsg" class="text-red-500 text-xs mt-3 text-center hidden"></p>

        {% if error %}
        <p class="text-red-500 text-xs mt-3 text-center">
            Invalid credentials
        </p>
        {% endif %}
    </div>

    <script type="module">

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyA0FUCoaBoG1LFTmfyWEeKD9pnSrx2xcf8",
        authDomain: "hr-project-cc735.firebaseapp.com",
        projectId: "hr-project-cc735",
        storageBucket: "hr-project-cc735.firebasestorage.app",
        messagingSenderId: "26413951817",
        appId: "1:26413951817:web:56ada1c87dee2b8800c898",
        measurementId: "G-2L1N2S48Z4"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const form = document.getElementById("loginForm");
    const passwordInput = document.getElementById("password");
    const togglePasswordBtn = document.getElementById("togglePassword");
    const eyeOpenIcon = document.getElementById("eyeOpenIcon");
    const eyeClosedIcon = document.getElementById("eyeClosedIcon");
    const errorMsg = document.getElementById("errorMsg");

    togglePasswordBtn.addEventListener("click", () => {
        const isHidden = passwordInput.type === "password";
        passwordInput.type = isHidden ? "text" : "password";
        togglePasswordBtn.setAttribute("aria-label", isHidden ? "Hide password" : "Show password");
        togglePasswordBtn.setAttribute("aria-pressed", String(isHidden));
        eyeOpenIcon.classList.toggle("hidden", isHidden);
        eyeClosedIcon.classList.toggle("hidden", !isHidden);
    });

    form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        try {
            const userCredential = await signInWithEmailAndPassword(auth, email, password);

            const token = await userCredential.user.getIdToken();
            // Persist token for subsequent admin API calls (dashboard, status updates, etc.)
            localStorage.setItem("admin_id_token", token);

            const response = await fetch("/admin/ping", {
                method: "GET",
                headers: {
                    "Authorization": "Bearer " + token
                }
            });

            if (!response.ok) {
                errorMsg.textContent = "Access denied";
                errorMsg.classList.remove("hidden");
                return;
            }

            const sess = await fetch("/admin/session", {
                method: "POST",
                headers: {
                    "Authorization": "Bearer " + token
                }
            });

            if (sess.ok) {
                window.location.href = "/admin-dashboard";
            } else {
                errorMsg.textContent = "Could not start admin session";
                errorMsg.classList.remove("hidden");
            }

        } catch (error) {
            errorMsg.textContent = error.message;
            errorMsg.classList.remove("hidden");
        }
    });
    </script>

</body>
</html>
